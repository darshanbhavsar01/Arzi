[project]
name = "arzi"
version = "0.1.0"
description = "Health-insurance claims auditor and appeals agent for Indian hospitals."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4.16.0",
    "fastapi>=0.165.0",
    "google-adk>=2.15",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-storage>=3.17.1",
    "google-genai>=2.34,<3",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pypdfium2>=5.15.2",
    "python-multipart>=0.0.20",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.16",
    "mypy>=2.4.1",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.6",
    "types-reportlab>=5.1.0.20261104",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arzi"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "N", "ANN"]
# Computation traces print the multiplication sign, as on an insurer's settlement sheet.
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
# Tests assert by design and use throwaway literals.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["arzi"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src:../scripts"
packages = ["arzi", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# pypdfium2 ships no type information (upload page counting, demo generator, tests).
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra", "-m", "not live"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls real Google Cloud APIs (excluded by default; costs money)"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["arzi"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
]
